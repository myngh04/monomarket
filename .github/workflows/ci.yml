name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing Docker image tag to redeploy; leave empty to build the selected main commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run verification suite
        run: ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    name: Build and publish Docker image
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.image_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/monomarket:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/monomarket:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish versioned Docker image tag
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version and commit
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vX.Y.Z format."
            exit 1
          fi

          commit_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Add release tag to existing Docker image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          source_image="docker.io/${DOCKERHUB_USERNAME}/monomarket:${COMMIT_SHA}"
          release_image="docker.io/${DOCKERHUB_USERNAME}/monomarket:${RELEASE_TAG}"

          if ! docker buildx imagetools inspect "$source_image" > /dev/null 2>&1; then
            echo "No Docker image exists for commit ${COMMIT_SHA}."
            echo "Create release tags only for commits already published from main."
            exit 1
          fi

          if docker buildx imagetools inspect "$release_image" > /dev/null 2>&1; then
            echo "Docker image tag ${RELEASE_TAG} already exists and will not be overwritten."
            exit 1
          fi

          docker buildx imagetools create --tag "$release_image" "$source_image"
          docker buildx imagetools inspect "$release_image"

  deploy:
    name: Deploy production
    needs:
      - test
      - publish
    if: >-
      always() &&
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == '' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' && needs.publish.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy-webapp.outputs.webapp-url }}
    concurrency:
      group: monomarket-production
      cancel-in-progress: true
    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Select Docker image
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          image_tag="${REQUESTED_IMAGE_TAG:-${GITHUB_SHA}}"
          echo "ref=docker.io/${DOCKERHUB_USERNAME}/monomarket:${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure App Service
        id: deploy-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ steps.image.outputs.ref }}
          restart: true

      - name: Wait for application health
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy-webapp.outputs.webapp-url }}
        run: |
          base_url="${BASE_URL%/}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 15 "${base_url}/actuator/health"; then
              exit 0
            fi
            echo "Application is not healthy yet (${attempt}/30)."
            sleep 10
          done
          echo "Application did not become healthy in time."
          exit 1

      - name: Verify public Product API
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy-webapp.outputs.webapp-url }}
        run: |
          base_url="${BASE_URL%/}"
          curl --fail --silent --show-error --location --max-time 30 \
            "${base_url}/api/v1/products?page=0&size=1" > /dev/null
