# File cấu hình cho môi trường test

# Tắt Flyway migration khi chạy test để tránh lỗi khi chạy test với Database H2
spring.flyway.enabled=false

# Dùng Hibernate để tự động tạo và xóa schema khi chạy test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Cấu hình datasource cho H2 database trong môi trường test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
