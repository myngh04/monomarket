<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Shipping & Confirmation - MonoMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --red-price: #dc2626;
      --orange-checkout: #f97316;
      --orange-hover: #ea580c;
    }

    body {
      background-color: var(--bg-light);
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      margin: 0;
      padding-bottom: 60px;
    }

    .container {
      width: calc(100% - 32px);
      max-width: 1320px;
      margin: 0 auto;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 80px;
      width: auto;
      object-fit: contain;
    }

    .stepper-wrap {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 24px;
      margin-bottom: 24px;
    }

    .stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .stepper::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 10%;
      right: 10%;
      height: 2px;
      background-color: #cbd5e1;
      z-index: 1;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .step-number {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 2px solid #cbd5e1;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .step-label {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .step-item.active .step-number {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .step-item.active .step-label {
      color: var(--primary);
      font-weight: 700;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 24px);
      }

      .stepper-wrap,
      .card {
        padding: 16px;
      }

      .step-label {
        font-size: 11px;
        text-align: center;
      }
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 90px;
      box-sizing: border-box;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }

    .checkout-item {
      display: flex;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .checkout-item:last-child {
      border-bottom: none;
    }

    .checkout-item-title {
      font-weight: 600;
      font-size: 14px;
      flex-grow: 1;
    }

    .checkout-item-price {
      font-weight: 700;
      color: var(--red-price);
      font-size: 14px;
    }

    .rank-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      background: #e2e8f0;
      color: #334155;
      margin-left: 6px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .summary-total {
      font-size: 18px;
      font-weight: 700;
      border-top: 2px solid var(--border-color);
      padding-top: 12px;
      margin-top: 12px;
    }

    .btn-place-order {
      width: 100%;
      background-color: var(--orange-checkout);
      color: #ffffff;
      border: none;
      padding: 14px 0;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 16px;
    }

    .btn-place-order:hover {
      background-color: var(--orange-hover);
    }

    .error-banner {
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 14px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-wrap">
      <a href="/" class="logo">
        <img th:src="@{/images/logo.png}" alt="MonoMarket Logo">
      </a>
      <div>
        <a href="/cart" class="back-to-shop-link" style="margin: 0;">← Back to Cart</a>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Các bước trong luồng checkout -->
    <div class="stepper-wrap">
      <div class="stepper">
        <div class="step-item">
          <div class="step-number">1</div>
          <div class="step-label">Cart</div>
        </div>
        <div class="step-item active">
          <div class="step-number">2</div>
          <div class="step-label">Shipping & Payment</div>
        </div>
        <div class="step-item">
          <div class="step-number">3</div>
          <div class="step-label">Confirmation</div>
        </div>
        <div class="step-item">
          <div class="step-number">✓</div>
          <div class="step-label">Complete</div>
        </div>
      </div>
    </div>

    <!-- Banner hiển thị lỗi -->
    <div th:if="${errorMessage}" class="error-banner">
      ⚠️ <span th:text="${errorMessage}">Error</span>
    </div>

    <form th:action="@{/checkout/confirm}" method="post">
      <div class="checkout-grid">

        <!-- Bên trái: Địa chỉ giao hàng và phương thức thanh toán -->
        <div>
          <div class="card">
            <div class="card-title">📍 1. Shipping Address</div>
            <div class="form-group">
              <label for="shippingAddress">Delivery Address <span style="color: red;">*</span></label>
              <textarea id="shippingAddress" name="shippingAddress" required placeholder="Enter full recipient name, street address, city, and phone number..."></textarea>
            </div>
          </div>

          <div class="card">
            <div class="card-title">💳 2. Payment Method</div>
            <div style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; display: flex; align-items: center; gap: 10px;">
              <input type="radio" checked id="cod" name="paymentMethod" value="COD">
              <label for="cod" style="margin: 0; font-weight: 600; cursor: pointer;">
                Cash on Delivery (COD) — Pay upon receiving items
              </label>
            </div>
          </div>

          <!-- Danh sách sản phẩm xem trước -->
          <div class="card">
            <div class="card-title">📦 3. Order Items (<span th:text="${#lists.size(cartItems)}">0</span>)</div>
            <div th:each="item : ${cartItems}" class="checkout-item">
              <div class="checkout-item-title">
                <span th:text="${item.titleJa}">Product Name</span>
                <span class="rank-badge" th:text="${'Rank ' + item.conditionRank}">Rank A</span>
              </div>
              <div class="checkout-item-price" th:text="${'¥' + #numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}">¥1,200</div>
            </div>
          </div>
        </div>

        <!-- Bên phải: Card tổng kết đơn hàng -->
        <div>
          <div class="card">
            <div class="card-title" style="border-bottom: none; margin-bottom: 8px;">Order Summary</div>

            <div class="summary-row">
              <span>Subtotal:</span>
              <span th:text="${'¥' + #numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}">¥0</span>
            </div>
            <div class="summary-row">
              <span>Shipping Fee:</span>
              <span style="color: #16a34a; font-weight: 600;">FREE</span>
            </div>

            <div class="summary-row summary-total">
              <span>Total:</span>
              <span style="color: var(--red-price);" th:text="${'¥' + #numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}">¥0</span>
            </div>

            <button type="submit" class="btn-place-order">Place Order</button>
            <p style="font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 12px;">
              🔒 Secure checkout. Stock reservation is completed upon order placement.
            </p>
          </div>
        </div>

      </div>
    </form>

  </main>

</body>
</html>
