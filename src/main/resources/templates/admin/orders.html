<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - MonoMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
  <div class="admin-shell">
    <aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside>
    <div class="admin-content">
      <header th:replace="~{admin/fragments :: topbar('Orders')}"></header>
      <main class="admin-main">
        <section class="page-header">
          <div>
            <div class="page-eyebrow">Sales operations</div>
            <h1 class="page-title">Orders</h1>
            <p class="page-description">Read-only overview of customer orders and fulfillment status.</p>
          </div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">Customer orders</h2>
              <p class="panel-subtitle" th:text="${orderPage.totalElements + ' total orders'}">0 total orders</p>
            </div>
          </div>
          <div th:if="${orderPage.totalElements == 0}" class="empty-state">No orders were found.</div>
          <div th:if="${orderPage.totalElements > 0}" class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Created</th>
                  <th>Total</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="order : ${orderPage.content}">
                  <td><span class="primary-text" th:text="${'#' + order.id}">#1</span></td>
                  <td th:text="${order.user != null ? order.user.email : 'Guest'}">user@example.com</td>
                  <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                  <td><span class="money"
                      th:text="${'¥' + #numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')}">¥0</span></td>
                  <td><span class="status-badge" th:classappend="${' status-' + order.status}"
                      th:text="${order.status}">PENDING</span></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:if="${orderPage.totalPages > 1}" class="pagination"><span class="pagination-info"
              th:text="${'Page ' + (orderPage.number + 1) + ' of ' + orderPage.totalPages}">Page</span>
            <div class="pagination-actions"><a class="page-button"
                th:classappend="${not orderPage.hasPrevious() ? ' disabled' : ''}"
                th:href="@{/admin/orders(page=${orderPage.number - 1})}">←</a><a class="page-button"
                th:classappend="${not orderPage.hasNext() ? ' disabled' : ''}"
                th:href="@{/admin/orders(page=${orderPage.number + 1})}">→</a></div>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>

</html>
