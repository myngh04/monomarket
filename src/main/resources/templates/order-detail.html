<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Detail - MonoMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    :root {
      --primary: #1e3a8a;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-light);
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      margin: 0;
      padding-bottom: 60px;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
      margin-bottom: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .rank-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      background: #e2e8f0;
      color: #334155;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/" class="logo">
        <img th:src="@{/images/logo.png}" alt="MonoMarket Logo" style="height: 90px;">
      </a>
      <a href="/orders" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Back to My Orders</a>
    </div>
  </header>

  <main class="container" style="max-width: 760px;">
    <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 20px;" th:text="${'Order Details #' + order.orderId}">Order #1001</h1>

    <div class="card">
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
        <span style="color: var(--text-muted);">Order Date:</span>
        <span style="font-weight: 600;" th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2026-07-29</span>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
        <span style="color: var(--text-muted);">Status:</span>
        <span style="background: #fef3c7; color: #d97706; padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 12px;" th:text="${order.status}">PENDING</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 14px;">
        <span style="color: var(--text-muted);">Shipping Address:</span>
        <span style="font-weight: 500;" th:text="${order.shippingAddress}">Address</span>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Ordered Items</h2>
      
      <div th:each="item : ${order.items}" class="item-row">
        <div>
          <div style="font-weight: 600; font-size: 14px;">
            <span th:text="${item.productTitle}">Product Title</span>
            <span class="rank-badge" th:text="${'Rank ' + item.conditionRank}">Rank A</span>
          </div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;" th:text="${'Code: ' + item.instoreCode}">Code</div>
        </div>
        <div style="font-weight: 700; color: #dc2626; font-size: 14px;" th:text="${'¥' + #numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}">¥1,200</div>
      </div>

      <div style="border-top: 2px solid var(--border-color); margin-top: 16px; padding-top: 12px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 700;">
        <span>Total Amount:</span>
        <span style="color: #dc2626;" th:text="${'¥' + #numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')}">¥1,200</span>
      </div>
    </div>
  </main>

</body>
</html>
