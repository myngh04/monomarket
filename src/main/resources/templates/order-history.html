<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - MonoMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    :root {
      --primary: #1e3a8a;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-light);
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      margin: 0;
      padding-bottom: 60px;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
      margin-bottom: 24px;
    }

    .orders-table {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      border-collapse: collapse;
      overflow: hidden;
    }

    .orders-table th, .orders-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      font-size: 14px;
    }

    .orders-table th {
      background: #f1f5f9;
      font-weight: 600;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      background: #fef3c7;
      color: #d97706;
    }

    .btn-detail {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .btn-detail:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/" class="logo">
        <img th:src="@{/images/logo.png}" alt="MonoMarket Logo" style="height: 90px;">
      </a>
      <a href="/" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Back to Shop</a>
    </div>
  </header>

  <main class="container">
    <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 20px;">My Orders</h1>

    <div th:if="${#lists.isEmpty(orders)}" style="background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 40px; text-align: center;">
      <p style="color: var(--text-muted); font-size: 16px;">You haven't placed any orders yet.</p>
      <a href="/" style="display: inline-block; margin-top: 12px; background: var(--primary); color: #ffffff; padding: 10px 24px; border-radius: 6px; text-decoration: none; font-weight: 600;">Start Shopping</a>
    </div>

    <table th:if="${not #lists.isEmpty(orders)}" class="orders-table">
      <thead>
        <tr>
          <th>Order #</th>
          <th>Date</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="order : ${orders}">
          <td style="font-weight: 700;" th:text="${'#' + order.orderId}">#1001</td>
          <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2026-07-29</td>
          <td th:text="${#lists.size(order.items) + ' item(s)'}">1 item</td>
          <td style="font-weight: 700; color: #dc2626;" th:text="${'¥' + #numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')}">¥1,200</td>
          <td><span class="status-badge" th:text="${order.status}">PENDING</span></td>
          <td><a th:href="@{'/orders/' + ${order.orderId}}" class="btn-detail">View Details →</a></td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
